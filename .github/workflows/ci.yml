name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS 26 on Apple silicon: the test binaries link the prebuilt libappleai.dylib, which loads
  # FoundationModels (macOS 26+). The runners have no Apple Intelligence model, so the live probes
  # (`--ignored`) are run locally, not here — see the README's Development section.
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  js:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
