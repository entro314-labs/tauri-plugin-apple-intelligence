[package]
name = "tauri-plugin-apple-intelligence"
version = "0.13.0"
description = "Tauri plugin for Apple Intelligence (Foundation Models): on-device and Private Cloud Compute generation, streaming, tool calling, and capability queries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/entro314-labs/tauri-plugin-apple-intelligence"
homepage = "https://github.com/entro314-labs/tauri-plugin-apple-intelligence#readme"
edition = "2024"
rust-version = "1.98.1"
keywords = ["tauri", "plugin", "apple-intelligence", "foundation-models", "on-device"]
links = "tauri-plugin-apple-intelligence"
# Anchored with a leading `/`: `include` uses gitignore semantics, so an unanchored "README.md" or
# "LICENSE" also matches every copy under node_modules/ and would ship them in the crate.
include = [
	"/src/**",
	"/build.rs",
	"/permissions/**",
	"/prebuilt/**",
	"/ailib/**",
	"/scripts/**",
	"/Cargo.toml",
	"/README.md",
	"/LICENSE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a JSON Schema's property order is part of its meaning to guided generation (the
# model fills properties in declared order), so schemas must keep it through parsing.
serde_json = { version = "1.0", features = ["preserve_order"] }
tauri = { version = "2" }
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# MockRuntime app for the stream/cancel integration test (tests/mock_app_stream.rs).
tauri = { version = "2", features = ["test"] }
serde_json = "1"
